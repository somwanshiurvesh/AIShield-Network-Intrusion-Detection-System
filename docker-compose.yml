version: '3.8'

services:
  # Backend service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8000"  # Changed host port from 8000 to 8081
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/eval:/app/eval
    environment:
      - DEBUG=False
      - CORS_ORIGINS=http://localhost:8080  # Updated to match frontend port
    # healthcheck temporarily disabled
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health", "||", "exit", "1"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 15s
    restart: unless-stopped

  # Frontend service (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8081  # Changed to match new backend host port
    ports:
      - "8080:3001"  # Changed host port from 80 to 8080
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:8081  # Updated to new backend URL
    depends_on:
      - backend
    restart: unless-stopped
